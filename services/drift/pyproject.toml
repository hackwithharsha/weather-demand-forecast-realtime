[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drift"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "evidently>=0.4.30,<0.5",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
