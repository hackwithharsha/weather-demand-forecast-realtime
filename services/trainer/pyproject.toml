[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlflow>=2.15",
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "boto3>=1.34",        # MLflow artifact store (MinIO)
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/pytest-trainer-cache"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
