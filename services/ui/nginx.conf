server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every non-file path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API proxy — strips /api prefix, forwards to FastAPI
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # WebSocket proxy — strips /ws prefix, handles Upgrade handshake
    location /ws/ {
        proxy_pass          http://api:8000/ws/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  86400s;
    }

    # Prometheus query proxy — strips /prom prefix
    # Available only when obs profile is running; 502 responses are handled in JS.
    location /prom/ {
        proxy_pass         http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }
}
