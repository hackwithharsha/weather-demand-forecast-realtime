[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingestor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
