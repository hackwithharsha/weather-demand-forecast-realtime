[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "boto3>=1.34",
    "duckdb>=1.0",
    "holidays>=0.46",
    "numpy>=1.26",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "pyarrow>=14.0",
    "pydantic-settings>=2.5",
    "scikit-learn>=1.4",
    "structlog>=24.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
