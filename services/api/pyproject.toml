[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "redis[hiredis]>=5.0",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    # ML serving
    "mlflow>=2.15",
    "scikit-learn>=1.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "boto3>=1.34",        # MLflow S3/MinIO artifact store
    # Async data access
    "asyncpg>=0.29",
    # Observability
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
