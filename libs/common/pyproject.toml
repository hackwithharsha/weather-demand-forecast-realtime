[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "asyncpg>=0.29",
    "redis[asyncio]>=5.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
