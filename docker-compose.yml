services:

  # ---------------------------------------------------------------------------
  # core  –  postgres + redis
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-forecast}
      POSTGRES_USER:     ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-forecast}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mock-weather:
    build:
      context: .
      dockerfile: services/mock-weather/Dockerfile
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    environment:
      FAULT_LATENCY_MS:      ${FAULT_LATENCY_MS:-0}
      FAULT_ERROR_RATE:      ${FAULT_ERROR_RATE:-0}
      FAULT_NULL_FIELD_RATE: ${FAULT_NULL_FIELD_RATE:-0}
      FAULT_SCHEMA_DRIFT:    ${FAULT_SCHEMA_DRIFT:-false}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  event-generator:
    build:
      context: .
      dockerfile: services/event-generator/Dockerfile
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    environment:
      CITIES:          ${GENERATOR_CITIES:-london,new_york,tokyo,sydney,dubai}
      TICK_INTERVAL_S: ${GENERATOR_TICK_INTERVAL_S:-1.0}
      SIM_SPEED:       ${GENERATOR_SIM_SPEED:-3600.0}
      SIM_START:       ${GENERATOR_SIM_START:-}

