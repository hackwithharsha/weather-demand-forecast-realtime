services:

  # ---------------------------------------------------------------------------
  # core  –  postgres + redis + mock-weather
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-forecast}
      POSTGRES_USER:     ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-forecast}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mock-weather:
    build:
      context: .
      dockerfile: services/mock-weather/Dockerfile
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    environment:
      FAULT_LATENCY_MS:      ${FAULT_LATENCY_MS:-0}
      FAULT_ERROR_RATE:      ${FAULT_ERROR_RATE:-0}
      FAULT_NULL_FIELD_RATE: ${FAULT_NULL_FIELD_RATE:-0}
      FAULT_SCHEMA_DRIFT:    ${FAULT_SCHEMA_DRIFT:-false}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  minio:
    image: quay.io/minio/minio:latest
    profiles: [core]
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [core]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      MINIO_ROOT_USER:      ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD:  ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SVC_ACCESS_KEY: ${MINIO_SVC_ACCESS_KEY:?MINIO_SVC_ACCESS_KEY is required}
      MINIO_SVC_SECRET_KEY: ${MINIO_SVC_SECRET_KEY:?MINIO_SVC_SECRET_KEY is required}
    volumes:
      - ./infra/minio/buckets.sh:/buckets.sh:ro
    entrypoint: ["/bin/sh", "/buckets.sh"]

  # ---------------------------------------------------------------------------
  # stream  –  redpanda + console + producers + ingestor
  # ---------------------------------------------------------------------------

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    profiles: [stream]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr      internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr        redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode            dev-container
      - --smp             1
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:19092:19092"   # Kafka API (external)
      - "127.0.0.1:18082:18082"   # HTTP Proxy
      - "127.0.0.1:18081:18081"   # Schema Registry
      - "127.0.0.1:9644:9644"     # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:v2.7.2
    profiles: [stream]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/cluster"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  redpanda-init:
    image: redpandadata/redpanda:v24.3.1
    profiles: [stream]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create demand.events.v1    --partitions 3 --brokers redpanda:9092 2>&1 || true
        rpk topic create weather.readings.v1 --partitions 3 --brokers redpanda:9092 2>&1 || true
        rpk topic create demand.events.dlq   --partitions 3 --brokers redpanda:9092 2>&1 || true
        echo "--- topics ---"
        rpk topic list --brokers redpanda:9092

  event-generator:
    build:
      context: .
      dockerfile: services/event-generator/Dockerfile
    profiles: [stream]
    restart: unless-stopped
    env_file: .env
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      CITIES:                   ${GENERATOR_CITIES:-london,new_york,tokyo,sydney,dubai}
      TICK_INTERVAL_S:          ${GENERATOR_TICK_INTERVAL_S:-1.0}
      SIM_SPEED:                ${GENERATOR_SIM_SPEED:-3600.0}
      SIM_START:                ${GENERATOR_SIM_START:-}
      KAFKA_BOOTSTRAP_SERVERS:  redpanda:9092
      DEMAND_TOPIC:             demand.events.v1

  weather-poller:
    build:
      context: .
      dockerfile: services/weather-poller/Dockerfile
    profiles: [stream]
    restart: unless-stopped
    env_file: .env
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      mock-weather:
        condition: service_healthy
    environment:
      CITIES:                   ${GENERATOR_CITIES:-london,new_york,tokyo,sydney,dubai}
      POLL_INTERVAL_S:          ${POLLER_POLL_INTERVAL_S:-30.0}
      MOCK_WEATHER_URL:         http://mock-weather:8001
      KAFKA_BOOTSTRAP_SERVERS:  redpanda:9092
      WEATHER_TOPIC:            weather.readings.v1

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    profiles: [stream]
    restart: unless-stopped
    env_file: .env
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST:            postgres
      POSTGRES_PORT:            5432
      POSTGRES_DB:              ${POSTGRES_DB:-forecast}
      POSTGRES_USER:            ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS:  redpanda:9092
      DEMAND_TOPIC:             demand.events.v1
      WEATHER_TOPIC:            weather.readings.v1
      DLQ_TOPIC:                demand.events.dlq
      MINIO_ENDPOINT_URL:       http://minio:9000
      MINIO_ACCESS_KEY:         ${MINIO_SVC_ACCESS_KEY:?MINIO_SVC_ACCESS_KEY is required}
      MINIO_SECRET_KEY:         ${MINIO_SVC_SECRET_KEY:?MINIO_SVC_SECRET_KEY is required}
      LAKE_BUCKET:              lake
      PARQUET_FLUSH_INTERVAL_S: ${PARQUET_FLUSH_INTERVAL_S:-60}

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
      target: dev
    profiles: [stream]
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST:                postgres
      POSTGRES_PORT:                5432
      POSTGRES_DB:                  ${POSTGRES_DB:-forecast}
      POSTGRES_USER:                ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD:            ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MINIO_ENDPOINT_URL:           http://minio:9000
      MINIO_ACCESS_KEY:             ${MINIO_SVC_ACCESS_KEY:?MINIO_SVC_ACCESS_KEY is required}
      MINIO_SECRET_KEY:             ${MINIO_SVC_SECRET_KEY:?MINIO_SVC_SECRET_KEY is required}
      LAKE_BUCKET:                  lake
      TRAINING_LOOKBACK_DAYS:       ${TRAINING_LOOKBACK_DAYS:-30}
      PIPELINE_CRON_MINUTE:         ${PIPELINE_CRON_MINUTE:-5}
      REDIS_HOST:                   redis
      REDIS_PORT:                   6379
      REDIS_DB:                     0
      REDIS_PASSWORD:               ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      FEATURE_STORE_CRON_HOUR:      ${FEATURE_STORE_CRON_HOUR:-2}
      FEATURE_STORE_CRON_MINUTE:    ${FEATURE_STORE_CRON_MINUTE:-30}
      KAFKA_BOOTSTRAP_SERVERS:      redpanda:9092
      DEMAND_TOPIC:                 demand.events.v1
      WEATHER_TOPIC:                weather.readings.v1
      STREAM_PARQUET_FLUSH_INTERVAL_S: ${STREAM_PARQUET_FLUSH_INTERVAL_S:-60}

  # ---------------------------------------------------------------------------
  # tools  –  alembic migrations + lake CLI
  # ---------------------------------------------------------------------------

  alembic:
    build:
      context: infra/postgres/alembic
    profiles: [tools]
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forecast}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-forecast}
    # Bind-mount the whole alembic directory so that `alembic revision`
    # writes new migration files back to the host (not lost in the container).
    volumes:
      - ./infra/postgres/alembic:/alembic
    depends_on:
      postgres:
        condition: service_healthy

  lake:
    build:
      context: tools
    profiles: [tools]
    restart: "no"
    env_file: .env
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY:   ${MINIO_SVC_ACCESS_KEY:?MINIO_SVC_ACCESS_KEY is required}
      MINIO_SECRET_KEY:   ${MINIO_SVC_SECRET_KEY:?MINIO_SVC_SECRET_KEY is required}
      LAKE_BUCKET:        lake
    depends_on:
      minio:
        condition: service_healthy

  bench:
    build:
      context: tools
    profiles: [tools]
    restart: "no"
    env_file: .env
    entrypoint: ["python", "-m", "tools.bench"]
    environment:
      POSTGRES_HOST:       postgres
      POSTGRES_PORT:       5432
      POSTGRES_DB:         ${POSTGRES_DB:-forecast}
      POSTGRES_USER:       ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CLICKHOUSE_HOST:     clickhouse
      CLICKHOUSE_PORT:     8123
      CLICKHOUSE_USER:     default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # ml  –  clickhouse + mlflow
  # ---------------------------------------------------------------------------

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    profiles: [ml]
    restart: unless-stopped
    env_file: .env
    environment:
      CLICKHOUSE_DB:       ml
      CLICKHOUSE_USER:     default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9009:9000"   # native TCP; 9000 is taken by MinIO on the host
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mlflow:
    build: infra/mlflow
    profiles: [ml]
    restart: unless-stopped
    env_file: .env
    environment:
      MLFLOW_BACKEND_STORE_URI:    postgresql://${POSTGRES_USER:-forecast}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow/
      AWS_ACCESS_KEY_ID:           ${MINIO_SVC_ACCESS_KEY:?MINIO_SVC_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY:       ${MINIO_SVC_SECRET_KEY:?MINIO_SVC_SECRET_KEY is required}
      MLFLOW_S3_ENDPOINT_URL:      http://minio:9000
    ports:
      - "127.0.0.1:5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s

  trainer:
    build:
      context: .
      dockerfile: services/trainer/Dockerfile
    profiles: [ml]
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST:         postgres
      POSTGRES_PORT:         5432
      POSTGRES_DB:           ${POSTGRES_DB:-forecast}
      POSTGRES_USER:         ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD:     ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MLFLOW_TRACKING_URI:   http://mlflow:5000
      AWS_ACCESS_KEY_ID:     ${MINIO_SVC_ACCESS_KEY:?MINIO_SVC_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SVC_SECRET_KEY:?MINIO_SVC_SECRET_KEY is required}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      TRAINING_LOOKBACK_DAYS: ${TRAINING_LOOKBACK_DAYS:-30}
      VAL_DAYS:              ${TRAINER_VAL_DAYS:-7}
      RANDOM_SEED:           ${RANDOM_SEED:-42}
      GIT_SHA:               ${GIT_SHA:-unknown}
      GIT_PYTHON_REFRESH:    quiet
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # obs  –  prometheus, grafana
  # TODO: define when observability layer is implemented
  # ---------------------------------------------------------------------------

  # prometheus:
  #   image: prom/prometheus:latest
  #   profiles: [obs]

  # grafana:
  #   image: grafana/grafana:latest
  #   profiles: [obs]

  # ---------------------------------------------------------------------------
  # ui  –  api, ingestion, forecaster, frontend
  # ---------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    profiles: [ui]
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      REDIS_DB:       0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:8080:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ingestion:
  #   build: ./services/ingestion
  #   profiles: [ui]

  # forecaster:
  #   build: ./services/forecaster
  #   profiles: [ui]

  # frontend:
  #   build: ./services/frontend
  #   profiles: [ui]

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
  clickhouse_data:
