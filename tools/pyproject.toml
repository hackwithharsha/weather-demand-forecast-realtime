[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lake-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.0",
    "pandas>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 88
