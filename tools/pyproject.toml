[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lake-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "clickhouse-connect>=0.7",
    "confluent-kafka>=2.3",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "pyarrow>=14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 88
