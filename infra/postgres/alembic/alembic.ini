[alembic]
script_location = .
prepend_sys_path = .
version_locations = versions

# Overridden at runtime by env.py, which reads DATABASE_URL from the
# environment and calls config.set_main_option("sqlalchemy.url", ...).
# The placeholder below is never used but must be syntactically valid so
# that configparser does not raise InterpolationMissingOptionError on load.
sqlalchemy.url = postgresql://

# Generated migration filenames: <rev>_<slug>.py
# The existing 0001_ / 0002_ prefix is a manual convention — rename the
# scaffolded file after running `make migrate-new` if you want to continue it.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
