global:
  resolve_timeout: 5m

route:
  receiver: webhook-receiver
  # Batch alerts that arrive within 30 s of the first one into a single
  # notification so the receiver log isn't flooded on a cascade.
  group_wait:      30s
  # After the initial notification, wait 5 min before sending an update
  # for the same group if new alerts have fired.
  group_interval:  5m
  # Re-send a still-firing alert every hour so it stays visible.
  repeat_interval: 1h
  # Group by alertname so every distinct alert type forms its own batch.
  group_by: [alertname]

receivers:
  - name: webhook-receiver
    webhook_configs:
      - url: http://webhook-receiver:9999/alert
        send_resolved: true
