apiVersion: 1

datasources:
  - name: Postgres
    type: postgres
    uid: postgres
    url: postgres:5432
    user: ${POSTGRES_USER:-forecast}
    database: ${POSTGRES_DB:-forecast}
    isDefault: false
    access: proxy
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
