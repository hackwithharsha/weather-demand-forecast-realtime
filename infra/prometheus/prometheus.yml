global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Alert rules loaded from this file.
rule_files:
  - /etc/prometheus/alerts.yml

# Route firing alerts to Alertmanager.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI — /metrics endpoint added to the API service
  - job_name: api
    static_configs:
      - targets: ['api:8000']

  # Ingestor — prometheus_client.start_http_server(9100)
  - job_name: ingestor
    static_configs:
      - targets: ['ingestor:9100']

  # Worker — prometheus_client.start_http_server(9101)
  # (also exports drift check metrics after the drift job was moved here)
  - job_name: worker
    static_configs:
      - targets: ['worker:9101']

  # Drift detection job — prometheus_client.start_http_server(8000)
  - job_name: drift
    static_configs:
      - targets: ['drift:8000']

  # Pushgateway — trainer pushes one-shot metrics here after each training run
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Redpanda — consumer group lag and broker health metrics.
  # /public_metrics exposes stable, curated metrics (redpanda_kafka_*).
  # Used by the KafkaConsumerLagHigh alert rule.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ['redpanda:9644']
